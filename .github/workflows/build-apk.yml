name: Build APK Ekonzo

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les fichiers du projet
        run: |
          ls -la
          test -f buildozer.spec || (echo "ERREUR : buildozer.spec n'est pas à la racine du dépôt" && exit 1)
          test -f main.py || (echo "ERREUR : main.py n'est pas à la racine du dépôt" && exit 1)
          test -f ekonzo_web.py || (echo "ERREUR : ekonzo_web.py n'est pas à la racine du dépôt" && exit 1)

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv setuptools

      - name: Compiler l'APK
        run: buildozer -v android debug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ekonzo-apk
          path: bin/*.apk
